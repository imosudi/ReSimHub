<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>ReSimHub - Reinforcement Simulation and Experimentation</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#0f213d"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060c18" stop-opacity="0"/>
    </radialGradient>

    <!-- Central Hub Spherical Gradient -->
    <radialGradient id="hubCoreGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Satellite Node Gradients -->
    <radialGradient id="nodeTopGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <radialGradient id="nodeRightGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <radialGradient id="nodeBottomGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <radialGradient id="nodeLeftGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="60%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>

    <!-- Text Hub Wordmark Gradient -->
    <linearGradient id="textHubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="48" y="48" width="928" height="928" rx="180" fill="url(#bgGrad)"/>
  <rect x="48" y="48" width="928" height="928" rx="180" fill="none" stroke="url(#borderGrad)" stroke-width="3"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="512" cy="415" r="380" fill="url(#ambientGlow)"/>

  <!-- Subtle Concentric Orbit & Telemetry Rings -->
  <circle cx="512" cy="415" r="290" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="12 16"/>
  <circle cx="512" cy="415" r="225" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.18" stroke-dasharray="8 10"/>
  <circle cx="512" cy="415" r="160" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Primary Bus Lines to Satellite Nodes -->
  <g stroke-linecap="round">
    <!-- North Trace (Environment) -->
    <line x1="512" y1="315" x2="512" y2="195" stroke="#34d399" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="512" y1="315" x2="512" y2="195" stroke="#34d399" stroke-width="14" stroke-opacity="0.2" filter="url(#pulseGlow)"/>

    <!-- South Trace (Telemetry & Benchmarks) -->
    <line x1="512" y1="515" x2="512" y2="635" stroke="#818cf8" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="512" y1="515" x2="512" y2="635" stroke="#818cf8" stroke-width="14" stroke-opacity="0.2" filter="url(#pulseGlow)"/>

    <!-- East Trace (Orchestrator & Celery) -->
    <line x1="612" y1="415" x2="732" y2="415" stroke="#38bdf8" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="612" y1="415" x2="732" y2="415" stroke="#38bdf8" stroke-width="14" stroke-opacity="0.2" filter="url(#pulseGlow)"/>

    <!-- West Trace (Model Checkpoints & Weights) -->
    <line x1="412" y1="415" x2="292" y2="415" stroke="#f472b6" stroke-width="5" stroke-opacity="0.75"/>
    <line x1="412" y1="415" x2="292" y2="415" stroke="#f472b6" stroke-width="14" stroke-opacity="0.2" filter="url(#pulseGlow)"/>

    <!-- Diagonal Secondary Synaptic Connectors -->
    <line x1="430" y1="333" x2="350" y2="253" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6 6"/>
    <line x1="594" y1="333" x2="674" y2="253" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6 6"/>
    <line x1="430" y1="497" x2="350" y2="577" stroke="#818cf8" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6 6"/>
    <line x1="594" y1="497" x2="674" y2="577" stroke="#818cf8" stroke-width="3" stroke-opacity="0.4" stroke-dasharray="6 6"/>
  </g>

  <!-- Diagonal Secondary Micro Nodes -->
  <g filter="url(#nodeShadow)">
    <circle cx="350" cy="253" r="14" fill="#081b33" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="350" cy="253" r="5" fill="#38bdf8"/>

    <circle cx="674" cy="253" r="14" fill="#081b33" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="674" cy="253" r="5" fill="#38bdf8"/>

    <circle cx="350" cy="577" r="14" fill="#081b33" stroke="#818cf8" stroke-width="3"/>
    <circle cx="350" cy="577" r="5" fill="#818cf8"/>

    <circle cx="674" cy="577" r="14" fill="#081b33" stroke="#818cf8" stroke-width="3"/>
    <circle cx="674" cy="577" r="5" fill="#818cf8"/>
  </g>

  <!-- Primary Satellite Nodes -->
  <g filter="url(#nodeShadow)">
    <!-- North: Gym & Simulation Environments -->
    <circle cx="512" cy="180" r="42" fill="#081b33" stroke="#34d399" stroke-width="6"/>
    <circle cx="512" cy="180" r="28" fill="url(#nodeTopGrad)" filter="url(#pulseGlow)"/>
    <circle cx="512" cy="180" r="10" fill="#ffffff" opacity="0.8"/>

    <!-- East: Distributed Orchestration -->
    <circle cx="745" cy="415" r="42" fill="#081b33" stroke="#38bdf8" stroke-width="6"/>
    <circle cx="745" cy="415" r="28" fill="url(#nodeRightGrad)" filter="url(#pulseGlow)"/>
    <circle cx="745" cy="415" r="10" fill="#ffffff" opacity="0.8"/>

    <!-- South: Telemetry, Metrics & Analytics -->
    <circle cx="512" cy="650" r="42" fill="#081b33" stroke="#818cf8" stroke-width="6"/>
    <circle cx="512" cy="650" r="28" fill="url(#nodeBottomGrad)" filter="url(#pulseGlow)"/>
    <circle cx="512" cy="650" r="10" fill="#ffffff" opacity="0.8"/>

    <!-- West: Model Checkpoint Registry -->
    <circle cx="279" cy="415" r="42" fill="#081b33" stroke="#f472b6" stroke-width="6"/>
    <circle cx="279" cy="415" r="28" fill="url(#nodeLeftGrad)" filter="url(#pulseGlow)"/>
    <circle cx="279" cy="415" r="10" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Central Simulation Hub Nexus -->
  <g filter="url(#coreGlow)">
    <!-- Outer Radiant Ring -->
    <circle cx="512" cy="415" r="108" fill="none" stroke="url(#ringGrad)" stroke-width="8" opacity="0.9"/>
    <!-- Deep Glassmorphism Housing -->
    <circle cx="512" cy="415" r="98" fill="#06182e" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>
    <!-- Spherical Core -->
    <circle cx="512" cy="415" r="82" fill="url(#hubCoreGrad)"/>
  </g>

  <!-- RL Feedback Loop Emblem (Agent <-> Environment Cycle) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Arc: Environment State & Reward Flow -->
    <path d="M 462 380 A 62 62 0 0 1 568 385" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.95"/>
    <polygon points="576,380 568,400 554,386" fill="#ffffff"/>

    <!-- Bottom Arc: Action Policy Flow -->
    <path d="M 562 450 A 62 62 0 0 1 456 445" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.95"/>
    <polygon points="448,450 456,430 470,444" fill="#ffffff"/>

    <!-- Central Neural Quantum Pulse -->
    <circle cx="512" cy="415" r="18" fill="#ffffff" filter="url(#pulseGlow)"/>
    <circle cx="512" cy="415" r="10" fill="#67e8f9"/>
  </g>

  <!-- Telemetry Pulse Orbiters -->
  <circle cx="512" cy="307" r="5" fill="#6ee7b7" filter="url(#pulseGlow)"/>
  <circle cx="620" cy="415" r="5" fill="#38bdf8" filter="url(#pulseGlow)"/>
  <circle cx="512" cy="523" r="5" fill="#a5b4fc" filter="url(#pulseGlow)"/>
  <circle cx="404" cy="415" r="5" fill="#fbcfe8" filter="url(#pulseGlow)"/>

  <!-- Typography: Wordmark & Tagline -->
  <g text-anchor="middle">
    <!-- Main Logotype -->
    <text x="512" y="805" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="74" letter-spacing="-1.5px">
      <tspan fill="#f8fafc">ReSim</tspan>
      <tspan fill="url(#textHubGrad)">Hub</tspan>
    </text>

    <!-- Refined Subtitle Tagline -->
    <text x="512" y="858" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-weight="600" font-size="19" fill="#94a3b8" letter-spacing="5.5px">
      REINFORCEMENT SIMULATION &amp; EXPERIMENTATION
    </text>
  </g>
</svg>
