<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>ReSimHub App Icon</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="50%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#0f213d"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#060c18" stop-opacity="0"/>
    </radialGradient>

    <!-- Central Hub Spherical Gradient -->
    <radialGradient id="hubCoreGrad" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="75%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Satellite Node Gradients -->
    <radialGradient id="nodeTopGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <radialGradient id="nodeRightGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>

    <radialGradient id="nodeBottomGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>

    <radialGradient id="nodeLeftGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="60%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container / Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="128" cy="128" r="95" fill="url(#ambientGlow)"/>

  <!-- Subtle Concentric Orbit Rings -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="4 5"/>
  <circle cx="128" cy="128" r="54" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.22"/>

  <!-- Primary Bus Lines to Satellite Nodes -->
  <g stroke-linecap="round">
    <!-- North Trace (Gym Environments) -->
    <line x1="128" y1="96" x2="128" y2="58" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="128" y1="96" x2="128" y2="58" stroke="#34d399" stroke-width="6" stroke-opacity="0.25" filter="url(#pulseGlow)"/>

    <!-- South Trace (Telemetry & Benchmarks) -->
    <line x1="128" y1="160" x2="128" y2="198" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="128" y1="160" x2="128" y2="198" stroke="#818cf8" stroke-width="6" stroke-opacity="0.25" filter="url(#pulseGlow)"/>

    <!-- East Trace (Orchestration & Celery) -->
    <line x1="160" y1="128" x2="198" y2="128" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="160" y1="128" x2="198" y2="128" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.25" filter="url(#pulseGlow)"/>

    <!-- West Trace (Model Registry & Weights) -->
    <line x1="96" y1="128" x2="58" y2="128" stroke="#f472b6" stroke-width="2.5" stroke-opacity="0.8"/>
    <line x1="96" y1="128" x2="58" y2="128" stroke="#f472b6" stroke-width="6" stroke-opacity="0.25" filter="url(#pulseGlow)"/>

    <!-- Diagonal Micro Connectors -->
    <line x1="105" y1="105" x2="84" y2="84" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
    <line x1="151" y1="105" x2="172" y2="84" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
    <line x1="105" y1="151" x2="84" y2="172" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
    <line x1="151" y1="151" x2="172" y2="172" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  </g>

  <!-- Diagonal Secondary Micro Nodes -->
  <g filter="url(#nodeShadow)">
    <circle cx="84" cy="84" r="4.5" fill="#081b33" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="84" cy="84" r="1.5" fill="#38bdf8"/>

    <circle cx="172" cy="84" r="4.5" fill="#081b33" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="172" cy="84" r="1.5" fill="#38bdf8"/>

    <circle cx="84" cy="172" r="4.5" fill="#081b33" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="84" cy="172" r="1.5" fill="#818cf8"/>

    <circle cx="172" cy="172" r="4.5" fill="#081b33" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="172" cy="172" r="1.5" fill="#818cf8"/>
  </g>

  <!-- Primary Satellite Nodes -->
  <g filter="url(#nodeShadow)">
    <!-- North: Gym & Simulation -->
    <circle cx="128" cy="54" r="14" fill="#081b33" stroke="#34d399" stroke-width="2.5"/>
    <circle cx="128" cy="54" r="9" fill="url(#nodeTopGrad)" filter="url(#pulseGlow)"/>
    <circle cx="128" cy="54" r="3.5" fill="#ffffff" opacity="0.9"/>

    <!-- East: Distributed Orchestration -->
    <circle cx="202" cy="128" r="14" fill="#081b33" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="202" cy="128" r="9" fill="url(#nodeRightGrad)" filter="url(#pulseGlow)"/>
    <circle cx="202" cy="128" r="3.5" fill="#ffffff" opacity="0.9"/>

    <!-- South: Telemetry & Analytics -->
    <circle cx="128" cy="202" r="14" fill="#081b33" stroke="#818cf8" stroke-width="2.5"/>
    <circle cx="128" cy="202" r="9" fill="url(#nodeBottomGrad)" filter="url(#pulseGlow)"/>
    <circle cx="128" cy="202" r="3.5" fill="#ffffff" opacity="0.9"/>

    <!-- West: Model Checkpoints -->
    <circle cx="54" cy="128" r="14" fill="#081b33" stroke="#f472b6" stroke-width="2.5"/>
    <circle cx="54" cy="128" r="9" fill="url(#nodeLeftGrad)" filter="url(#pulseGlow)"/>
    <circle cx="54" cy="128" r="3.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Central Simulation Hub Nexus -->
  <g filter="url(#coreGlow)">
    <!-- Outer Radiant Ring -->
    <circle cx="128" cy="128" r="37" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.95"/>
    <!-- Deep Glassmorphism Housing -->
    <circle cx="128" cy="128" r="33" fill="#06182e" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Spherical Core -->
    <circle cx="128" cy="128" r="28" fill="url(#hubCoreGrad)"/>
  </g>

  <!-- RL Feedback Loop Emblem (Agent <-> Environment Cycle) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Arc: Environment State & Reward Flow -->
    <path d="M 111 116 A 21 21 0 0 1 147 118" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95"/>
    <polygon points="150,116 147,123 142,118" fill="#ffffff"/>

    <!-- Bottom Arc: Action Policy Flow -->
    <path d="M 145 140 A 21 21 0 0 1 109 138" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95"/>
    <polygon points="106,140 109,133 114,138" fill="#ffffff"/>

    <!-- Central Neural Quantum Pulse -->
    <circle cx="128" cy="128" r="6" fill="#ffffff" filter="url(#pulseGlow)"/>
    <circle cx="128" cy="128" r="3.5" fill="#67e8f9"/>
  </g>

  <!-- Telemetry Pulse Orbiters -->
  <circle cx="128" cy="91" r="2" fill="#6ee7b7" filter="url(#pulseGlow)"/>
  <circle cx="165" cy="128" r="2" fill="#38bdf8" filter="url(#pulseGlow)"/>
  <circle cx="128" cy="165" r="2" fill="#a5b4fc" filter="url(#pulseGlow)"/>
  <circle cx="91" cy="128" r="2" fill="#fbcfe8" filter="url(#pulseGlow)"/>
</svg>
